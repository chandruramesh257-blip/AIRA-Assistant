<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIRA — Your AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #0b1020;
      color: #e8ecf8;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #223055;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00d4ff, #7b5cff);
      display: grid;
      place-items: center;
      font-weight: bold;
      color: #04101f;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    p {
      margin: 2px 0 0;
      color: #9fb0d0;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .aira {
      align-self: flex-start;
      background: #16224a;
      border: 1px solid #2b3d6d;
      border-bottom-left-radius: 4px;
    }

    form {
      display: flex;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #223055;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #2b3d6d;
      background: #101a35;
      color: white;
      font-size: 15px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00d4ff, #7b5cff);
      color: #04101f;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">AI</div>
      <div>
        <h1>AIRA</h1>
        <p>Your personal and online-business AI assistant</p>
      </div>
    </header>

    <div id="chat"></div>

    <form id="chat-form">
      <input
        id="message"
        autocomplete="off"
        placeholder="Ask AIRA anything..."
      />
      <button id="send">Send</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    addMessage(
      "Hello! I am AIRA, your personal and business assistant.\n\nTry:\n• Save a note: My business idea is AI social-media service\n• Create a task: Contact 5 local businesses tomorrow\n• Add lead: Rahul wants Instagram content for his café\n• Help me create a business plan",
      "aira"
    );

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      sendButton.disabled = true;

      const thinking = document.createElement("div");
      thinking.className = "message aira";
      thinking.textContent = "AIRA is thinking...";
      chat.appendChild(thinking);
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();
        thinking.remove();
        addMessage(data.reply || "Sorry, I could not respond.", "aira");
      } catch (error) {
        thinking.remove();
        addMessage("Connection error. Please try again.", "aira");
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
